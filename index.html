<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascart Home</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap');
    
    body { font-family: Arial, Helvetica, sans-serif; }
    
    body {
        background-image: url("https://haqwhd.github.io/Ascart/bg.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: black;
        height: 80vh;
    }
    
    .title {
        color: white;
        text-align: center;
        font-size: clamp(70px, 90px, 110px);
        font-family: "Bitcount Prop Single", Arial, Helvetica, sans-serif;
        position: relative;
        top: 20px;
    }
    .white {
        color: white;
    }
    
    .links { text-align: center; }
    .links a {
        display: inline-block;
        color: white;
        text-align: center;
        font-size: clamp(16px, 26px, 36px);
        transition: transform 0.2s ease-in-out;
    } .links a:hover { transform: scale(1.12); }
    
    .h3 {
        color: white;
        position: relative;
        text-align: center;
        font-size: clamp(12px, 20px, 30px);
        max-width: 600px;
        margin: 0 auto;
    }
  </style>
</head>
<body>
        <h1 class="title">Ascart Home</h1>
        <br> <br> <br>
        <div class="h3">
        <h3>Asart is a free-to-use platform created solely by me, Haqwhd, dedicated to sharing Ascii (and dot) art with people.</h3>
        </div>
        <br> <br>
        <div class="links">
            <a href="https://forms.gle/9v9y4mNscffDGsKS8">Post to Ascart</a> <br> <br>
            <a href="https://forms.gle/nUQm3eCjzcYMUJJt8">Create an Ascart account</a>
        </div>
</body>
</html>
